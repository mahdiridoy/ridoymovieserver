<!DOCTYPE html>
<html lang="en" data-theme="mocha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MovieBox Web — Stream Movies, Series, Anime &amp; Live TV</title>
  <meta name="description" content="MovieBox Web — find, watch and track movies, TV series, anime, Asian dramas and live TV. A modern browser app based on MovieBox-TUI. Local-only data, zero telemetry.">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark light">
  <link rel="canonical" href="https://mahdiridoy.github.io/ridoymovieserver/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MovieBox Web">
  <meta property="og:title" content="MovieBox Web — Stream Movies, Series, Anime &amp; Live TV">
  <meta property="og:description" content="A modern streaming web app based on MovieBox-TUI. Search across providers, watch in-browser, track favorites and history — all stored locally.">
  <meta property="og:url" content="https://mahdiridoy.github.io/ridoymovieserver/">
  <meta property="og:image" content="assets/icons/icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MovieBox Web">
  <meta name="twitter:description" content="Find, watch and track movies, series, anime and live TV in your browser.">
  <meta name="twitter:image" content="assets/icons/icon-512.png">
  <meta name="robots" content="index, follow">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/player.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div id="app">
    <aside id="sidebar" class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/home" aria-label="MovieBox Web home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect x="2" y="6" width="28" height="20" rx="4" fill="currentColor" opacity="0.16"/>
          <path d="M13 11.5v9l8-4.5z" fill="currentColor"/>
        </svg>
        <span class="brand-text">MovieBox<em>Web</em></span>
      </a>

      <nav class="side-nav" aria-label="Primary">
        <a href="#/home" data-nav="home"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z" fill="currentColor"/></svg><span>Home</span></a>
        <a href="#/movies" data-nav="movies"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm3.5 3.2v3.1l3-1.55zM14 15.5l4.5-2.6L14 10.3z" fill="currentColor"/></svg><span>Movies</span></a>
        <a href="#/series" data-nav="series"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zm5 2.5v5l4.5-2.5z" fill="currentColor"/></svg><span>Series</span></a>
        <a href="#/drama" data-nav="drama"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zm-1.2 5.4a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm4.8 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM7.6 14h8.8a4.4 4.4 0 0 1-8.8 0z" fill="currentColor"/></svg><span>Anime / Drama</span></a>
        <a href="#/tv" data-nav="tv"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm5-4 2.5 3H8.5L7 5.5 9 3zm6 0 2 2.5-1.5 1.5h-3L15 3z" fill="currentColor"/></svg><span>Live TV</span></a>
        <a href="#/search" data-nav="search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z" fill="currentColor"/></svg><span>Search</span></a>
        <a href="#/favorites" data-nav="favorites"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6 4.6 13.2a4.6 4.6 0 0 1 6.5-6.5l.9.9.9-.9a4.6 4.6 0 1 1 6.5 6.5z" fill="currentColor"/></svg><span>Favorites</span></a>
        <a href="#/history" data-nav="history"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 1-8.32 5.5H2v2h4.5V6h2v2.65A9 9 0 0 1 12 3zm-.9 3.6v5.16l4.03 2.37.9-1.54-3.13-1.85V6.6z" fill="currentColor"/></svg><span>History</span></a>
        <a href="#/addons" data-nav="addons"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3h2v4.6l3.3-1.9 1 1.7L14 9.3l3.3 1.9-1 1.7L13 11v4.6l2.8 1.6-1 1.7L12 17.4l-3.8 1.5-1-1.7L10 15.6V11l-3.3 1.9-1-1.7L8 9.3 4.7 7.4l1-1.7L9 7.6z" fill="currentColor"/></svg><span>Addons</span></a>
        <a href="#/settings" data-nav="settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8zm8.5 3.4c0 .5-.05 1-.13 1.47l2.05 1.6-2 3.46-2.42-.98c-.74.62-1.57 1.1-2.47 1.42L15 21h-4l-.53-2.63a8.6 8.6 0 0 1-2.47-1.42l-2.42.98-2-3.46 2.05-1.6a8.9 8.9 0 0 1 0-2.94L3.58 9.4l2-3.46 2.42.98A8.6 8.6 0 0 1 10.47 5.5L11 2.9h4l.53 2.63c.9.31 1.73.8 2.47 1.42l2.42-.98 2 3.46-2.05 1.6c.08.48.13.97.13 1.47z" fill="currentColor"/></svg><span>Settings</span></a>
      </nav>

      <div class="sidebar-foot">
        <a href="#/about" data-nav="about"><span>About</span></a>
        <p class="fineprint">Zero telemetry · Local data only</p>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <button id="menu-toggle" class="icon-btn only-mobile" type="button" aria-label="Open navigation" aria-expanded="false">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z" fill="currentColor"/></svg>
        </button>

        <a class="brand brand-mobile only-mobile" href="#/home" aria-label="MovieBox Web home">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="6" width="28" height="20" rx="4" fill="currentColor" opacity="0.16"/><path d="M13 11.5v9l8-4.5z" fill="currentColor"/></svg>
          <span class="brand-text">MovieBox<em>Web</em></span>
        </a>

        <form id="top-search" class="top-search" role="search" action="#/search">
          <svg class="ico search-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z" fill="currentColor"/></svg>
          <input id="top-search-input" type="search" name="q" placeholder="Search movies, series, anime…" autocomplete="off" aria-label="Search movies, series, anime and TV">
        </form>

        <div class="topbar-actions">
          <button id="theme-quick" class="icon-btn" type="button" aria-label="Toggle dark and light theme">
            <svg class="ico ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.7 3a7.5 7.5 0 1 0 8.3 8.3A6.5 6.5 0 0 1 12.7 3z" fill="currentColor"/></svg>
            <svg class="ico ico-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM11 2h2v3h-2zm0 17h2v3h-2zM2 11h3v2H2zm17 0h3v2h-3zM4.2 5.6l2.1-2.1 1.4 1.4-2.1 2.1zM16.3 17.7l2.1-2.1 1.4 1.4-2.1 2.1zM19.8 5.6l1.4-1.4 2.1 2.1-1.4 1.4zM4.2 18.4l-1.4 1.4 2.1 2.1 1.4-1.4z" fill="currentColor"/></svg>
          </button>
          <a class="icon-btn" href="#/favorites" aria-label="Favorites">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6 4.6 13.2a4.6 4.6 0 0 1 6.5-6.5l.9.9.9-.9a4.6 4.6 0 1 1 6.5 6.5z" fill="currentColor"/></svg>
          </a>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

      <nav class="bottom-nav only-mobile" aria-label="Primary mobile">
        <a href="#/home" data-nav="home"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z" fill="currentColor"/></svg><span>Home</span></a>
        <a href="#/search" data-nav="search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z" fill="currentColor"/></svg><span>Search</span></a>
        <a href="#/tv" data-nav="tv"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm5-4 2.5 3H8.5L7 5.5 9 3zm6 0 2 2.5-1.5 1.5h-3L15 3z" fill="currentColor"/></svg><span>Live TV</span></a>
        <a href="#/favorites" data-nav="favorites"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6 4.6 13.2a4.6 4.6 0 0 1 6.5-6.5l.9.9.9-.9a4.6 4.6 0 1 1 6.5 6.5z" fill="currentColor"/></svg><span>Favorites</span></a>
        <button id="more-toggle" class="bottom-more" type="button" aria-haspopup="true" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h4v4H5zm5 0h4v4h-4zm5 0h4v4h-4z" fill="currentColor"/></svg><span>More</span></button>
      </nav>
    </div>
  </div>

  <div id="sheet-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <template id="tpl-skeleton-card">
    <div class="card skeleton-card" aria-hidden="true">
      <div class="sk sk-poster"></div>
      <div class="sk sk-line w80"></div>
      <div class="sk sk-line w50"></div>
    </div>
  </template>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
